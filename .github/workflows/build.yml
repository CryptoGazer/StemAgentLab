name: Build & Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify OpenAI key is configured
        run: test -n "$OPENAI_API_KEY"

      - name: Run tests
        run: ./gradlew test

      - name: Build distribution (DMG)
        run: ./gradlew packageDmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: StemAgentLab-macOS
          path: build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Verify OpenAI key is configured
        shell: bash
        run: test -n "$OPENAI_API_KEY"

      - name: Run tests
        run: .\gradlew.bat test

      - name: Build distribution (MSI)
        run: .\gradlew.bat packageMsi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: StemAgentLab-Windows
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
